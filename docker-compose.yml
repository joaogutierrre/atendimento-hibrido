services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - platform_net

  gateway:
    build:
      context: ./service-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    env_file:
      - ./service-gateway/.env
    environment:
      # Overrides de rede (o .env usa localhost para rodar Prisma/ferramentas a partir do host)
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-platform}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform_net

  agent:
    build:
      context: ./service-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8000}:8000"
    env_file:
      - ./service-agent/.env
    environment:
      # Overrides de rede (o .env local pode apontar para localhost no host)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-platform}
      REDIS_URL: redis://redis:6379
      TENANT_TIMEZONE: ${TENANT_TIMEZONE:-America/Sao_Paulo}
    extra_hosts:
      # Permite alcançar serviços rodando no host (ex.: Ollama local)
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform_net
    profiles: ["app"]

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./service-frontend/dist:/usr/share/nginx/html:ro
      - ./service-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks:
      - platform_net
    profiles: ["app"]

  # Túnel Cloudflare para expor o gateway na internet (webhook do Telegram).
  # Quick tunnel: URL muda a cada start — re-registrar o webhook depois com
  # `bash infra/setup-telegram-webhook.sh`. Para hostname fixo, migrar para
  # named tunnel (criar tunnel na conta Cloudflare e trocar o command para
  # `tunnel run --token ${CLOUDFLARED_TOKEN}`).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:3000
    depends_on:
      - gateway
    networks:
      - platform_net
    profiles: ["tunnel"]

networks:
  platform_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
